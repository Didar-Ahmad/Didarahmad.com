<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Account | AuraMax</title>
    <link rel="stylesheet" href="css/account-page.css">
  </head>
  <body>
    <main class="account-shell">
      <a class="brand" href="index.html"><span>A</span><b>AuraMax</b></a>
      <section class="account-card" aria-labelledby="account-title">
        <p class="eyebrow">YOUR AURAMAX ACCOUNT</p>
        <h1 id="account-title">Sign in to AuraMax</h1>
        <p class="intro">Save your lessons and LookBook ideas, then continue where you left off.</p>
        <form id="account-form" novalidate>
          <div id="email-field"><label>Email<input type="email" name="email" autocomplete="email" required></label></div>
          <div id="password-field"><label>Password<input type="password" name="password" autocomplete="current-password" minlength="8" required></label></div>
          <div id="confirm-field" hidden><label>Confirm password<input type="password" name="confirmPassword" autocomplete="new-password" minlength="8"></label></div>
          <p class="status" id="account-status" role="status" aria-live="polite"></p>
          <button class="primary" type="submit" id="submit-button">Sign in</button>
        </form>
        <div class="links">
          <button type="button" data-mode="signup">Create a new account</button>
          <button type="button" data-mode="recovery">Forgot password?</button>
          <button type="button" data-mode="signin" id="back-to-signin" hidden>Back to sign in</button>
        </div>
      </section>
    </main>
    <script src="js/auramax-config.js"></script>
    <script type="module" src="js/account-page.js"></script>
  </body>
</html>
