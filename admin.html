<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Content Admin | AuraMax</title><link rel="stylesheet" href="css/portal.css"></head>
<body><header class="portal-nav"><a class="portal-brand" href="index.html"><span>A</span>AuraMax</a><nav><a href="index.html">View website</a><button id="sign-out" type="button">Sign out</button></nav></header>
<main class="portal-shell"><section class="portal-hero"><p class="eyebrow">ADMIN DASHBOARD</p><h1>Publish and manage AuraMax content.</h1><p>Upload an image, title and useful description into the correct category. Published items update the public gallery.</p></section><p id="portal-status" class="portal-status" role="status"></p><section class="admin-columns"><form id="content-form" class="admin-form"><h2>Add gallery content</h2><label>Category<select name="category" required><option>Color Combination</option><option>Styling Guide · LookBook</option><option>Quick Looksmax Tips</option><option>Looksmax Complete Guide</option><option>Looksmax Q&amp;A Advanced</option></select></label><label>Title<input name="title" maxlength="100" required placeholder="Clear content title"></label><label>Description<textarea name="description" maxlength="700" required placeholder="Explain the look, technique or lesson clearly."></textarea></label><label>Image<input name="image" type="file" accept="image/jpeg,image/png,image/webp" required></label><label class="check"><input name="published" type="checkbox" checked> Publish immediately</label><button class="button" type="submit">Upload and publish</button><p id="upload-status" class="portal-status" role="status"></p></form><section class="content-list"><div class="section-head"><div><p class="eyebrow">CONTENT LIBRARY</p><h2>Published and draft items</h2></div><button id="refresh" class="text-link" type="button">Refresh</button></div><div id="items"><p>Loading content…</p></div></section></section></main>
<script src="js/auramax-config.js"></script><script type="module" src="js/admin-page.js"></script></body></html>
